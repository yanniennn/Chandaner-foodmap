<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>茶蛋er点评 · 吃好喝好长生不老</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 左侧数据管理面板 -->
  <aside id="inputPanel">
    <div class="panel-header">
      <div class="panel-title-wrap">
        <svg class="panel-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9M12 20V10m0 10l-4-4m4 4l4-4M12 10V4m0 6L8 6m4 4l4-4"/>
        </svg>
        <span class="panel-title">数据管理</span>
      </div>
      <button class="panel-collapse-btn" id="collapsePanelBtn" title="收起/展开">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <div class="panel-body" id="panelBody">
      <div class="info-card">
        <div class="info-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
          </svg>
          如何更新数据
        </div>
        <div class="info-content">
          <p>数据存储在 GitHub 仓库中，直接编辑 JSON 文件即可更新地图。</p>
          <ol>
            <li>点击下方的「编辑数据」链接</li>
            <li>修改对应城市的 <code>data_*.json</code> 文件</li>
            <li>提交更改后，刷新页面即可看到更新</li>
          </ol>
        </div>
      </div>

      <div class="data-links">
        <a href="https://github.com/yanniennn/Chandaner-foodmap/blob/main/data_guangzhou.json" target="_blank" class="data-link">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          编辑广州数据
        </a>
        <a href="https://github.com/yanniennn/Chandaner-foodmap/blob/main/data_shenzhen.json" target="_blank" class="data-link">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          编辑深圳数据
        </a>
        <a href="https://github.com/yanniennn/Chandaner-foodmap/blob/main/data_foshan.json" target="_blank" class="data-link">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          编辑佛山数据
        </a>
      </div>

      <button class="btn btn-primary" id="refreshDataBtn" style="width:100%;justify-content:center;margin-top:16px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        刷新数据
      </button>

      <div class="github-link" style="margin-top:16px;text-align:center">
        <a href="https://github.com/yanniennn/Chandaner-foodmap" target="_blank" style="color:var(--text-secondary);font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          查看完整仓库
        </a>
      </div>
    </div>
  </aside>

  <!-- 顶部栏 -->
  <header id="topbar">
    <div class="topbar-left">
      <div class="logo-svg" id="logoIcon"></div>
      <div class="title-wrap">
        <h1>茶蛋er点评</h1>
        <span class="subtitle" id="citySubtitle">吃好喝好长生不老</span>
      </div>
      <div class="city-tabs" id="cityTabs">
        <button class="city-tab active" data-city="guangzhou">广州</button>
        <button class="city-tab" data-city="shenzhen">深圳</button>
        <button class="city-tab" data-city="foshan">佛山</button>
      </div>
    </div>
    <div class="topbar-center">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索店名、菜品、推荐人..." autocomplete="off">
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-icon" id="menuBtn" title="更多">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
        </svg>
      </button>
      <div class="menu-dropdown" id="menuDropdown">
        <button class="menu-item" id="refreshMenuBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          刷新数据
        </button>
      </div>
    </div>
  </header>

  <!-- 地图 -->
  <div id="map"></div>

  <!-- 侧边详情面板 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="close-btn" id="closeSidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </aside>

  <!-- 图例 -->
  <div class="legend" id="legend">
    <div class="legend-header" id="legendHeader">
      <span class="legend-title">推荐人</span>
      <svg class="legend-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="legend-body" id="legendBody"></div>
    <div class="legend-flower-info">
      <div class="flower-sizes">
        <div class="flower-size-item">
          <span class="mini-flower small"></span>
          <span>1人</span>
        </div>
        <div class="flower-size-item">
          <span class="mini-flower medium"></span>
          <span>2-3人</span>
        </div>
        <div class="flower-size-item">
          <span class="mini-flower large"></span>
          <span>4+人</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
