<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>茶蛋er点评 · 吃好喝好长生不老</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 左侧添加推荐面板 -->
  <aside id="inputPanel">
    <div class="panel-header">
      <div class="panel-title-wrap">
        <svg class="panel-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9M12 20V10m0 10l-4-4m4 4l4-4M12 10V4m0 6L8 6m4 4l4-4"/>
        </svg>
        <span class="panel-title">添加推荐</span>
      </div>
      <button class="panel-collapse-btn" id="collapsePanelBtn" title="收起/展开">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <div class="panel-body" id="panelBody">
      <form id="addForm">
        <div class="form-group">
          <label>餐厅名称 <span class="req">*</span></label>
          <input type="text" id="spotName" placeholder="输入店名..." required autocomplete="off">
        </div>

        <div class="form-group">
          <label>详细地址 <span class="req">*</span></label>
          <input type="text" id="spotAddress" placeholder="输入地址，点击搜索自动定位..." required autocomplete="off">
          <div class="location-btns" style="margin-top:6px">
            <button type="button" class="btn btn-outline btn-sm" id="searchAddrBtn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              搜索定位
            </button>
            <button type="button" class="btn btn-outline btn-sm" id="pickMapBtn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              地图选点
            </button>
          </div>
          <div class="location-display" id="locationDisplay">
            <span class="location-placeholder">尚未定位，请搜索地址或在地图上选点</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>分类</label>
            <select id="spotCategory">
              <option value="粤菜">粤菜</option>
              <option value="早茶">早茶</option>
              <option value="甜品">甜品</option>
              <option value="小吃">小吃</option>
              <option value="火锅">火锅</option>
              <option value="烧烤">烧烤</option>
              <option value="海鲜">海鲜</option>
              <option value="面食">面食</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>人均消费</label>
            <input type="number" id="spotPrice" placeholder="¥" min="0">
          </div>
        </div>

        <div class="form-group">
          <label>推荐人 <span class="req">*</span></label>
          <input type="text" id="recPerson" placeholder="你的名字" required autocomplete="off">
        </div>

        <div class="form-group">
          <label>推荐菜品</label>
          <input type="text" id="recDishes" placeholder="多个菜品用逗号分隔，如：虾饺，肠粉" autocomplete="off">
        </div>

        <div class="form-group">
          <label>评价</label>
          <textarea id="recReview" rows="2" placeholder="写几句评价..."></textarea>
        </div>

        <div class="form-group">
          <label>评分</label>
          <div class="star-picker" id="starPicker">
            <span class="star" data-val="1">★</span>
            <span class="star" data-val="2">★</span>
            <span class="star" data-val="3">★</span>
            <span class="star" data-val="4">★</span>
            <span class="star" data-val="5">★</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;justify-content:center;margin-top:4px">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          提交推荐
        </button>
        <div class="hint-text" id="formHint"></div>
      </form>

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-light)">
        <div style="font-size:11px;color:var(--text-muted);line-height:1.7">
          <p>💡 添加的内容保存在当前浏览器，刷新不丢失。</p>
          <p>如需让所有人看到，请通过菜单「导出数据」更新到 GitHub。</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- 顶部栏 -->
  <header id="topbar">
    <div class="topbar-left">
      <div class="logo-svg" id="logoIcon"></div>
      <div class="title-wrap">
        <h1>茶蛋er点评</h1>
        <span class="subtitle" id="citySubtitle">吃好喝好长生不老</span>
      </div>
      <div class="city-tabs" id="cityTabs">
        <button class="city-tab active" data-city="guangzhou">广州</button>
        <button class="city-tab" data-city="shenzhen">深圳</button>
        <button class="city-tab" data-city="foshan">佛山</button>
      </div>
    </div>
    <div class="topbar-center">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索店名、菜品、推荐人..." autocomplete="off">
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-icon" id="menuBtn" title="更多">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
        </svg>
      </button>
      <div class="menu-dropdown" id="menuDropdown">
        <button class="menu-item" id="refreshMenuBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          刷新数据
        </button>
        <button class="menu-item" id="exportMenuBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          导出数据
        </button>
        <button class="menu-item" id="clearLocalMenuBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          清空本地数据
        </button>
      </div>
    </div>
  </header>

  <!-- 地图 -->
  <div id="map"></div>

  <!-- 地图选点提示 -->
  <div class="add-hint" id="addHint">
    <div class="add-hint-inner">
      <span class="pulse-dot"></span>
      <span>点击地图选择位置</span>
      <button class="btn btn-text" id="cancelPickBtn" style="color:rgba(255,255,255,0.85)">取消</button>
    </div>
  </div>

  <!-- 侧边详情面板 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="close-btn" id="closeSidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </aside>

  <!-- 图例 -->
  <div class="legend" id="legend">
    <div class="legend-header" id="legendHeader">
      <span class="legend-title">推荐人</span>
      <svg class="legend-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="legend-body" id="legendBody"></div>
    <div class="legend-flower-info">
      <div class="flower-sizes">
        <div class="flower-size-item">
          <span class="mini-flower small"></span>
          <span>1人</span>
        </div>
        <div class="flower-size-item">
          <span class="mini-flower medium"></span>
          <span>2-3人</span>
        </div>
        <div class="flower-size-item">
          <span class="mini-flower large"></span>
          <span>4+人</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
